<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cortex Map</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: #242834; }
  #graph { position: relative; width: 100%; height: 100%; }
  canvas { display: block; }
  .tip {
    position: absolute; display: none; pointer-events: none;
    flex-direction: column; gap: 3px; max-width: 280px;
    font: 12px/1.35 -apple-system, "SF Pro Text", system-ui, sans-serif;
    background: #1b1e27; border: 1px solid #3a3f4e; border-radius: 6px;
    padding: 7px 10px; color: #e9ecf2;
  }
  .tip b { font-weight: 600; }
  .tip span { color: #8a90a2; font-size: 11px; }
</style>
</head>
<body>
<div id="graph"></div>
<script src="dist/graph.js"></script>
<script>
  // Standalone preview (outside the app): load sample data if Swift never calls setGraph.
  setTimeout(() => {
    if (window.webkit?.messageHandlers?.cortex || !window.Cortex) return;
    fetch('sample.json').then(r => r.json()).then(d => Cortex.setGraph(d)).catch(() => {});
  }, 300);
</script>
</body>
</html>
